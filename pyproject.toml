[project]
name = "vigente"
version = "0.1.0"
description = "Asistente de Monotributo con citas verificables — RAG sobre normativa real de InfoLeg."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sentence-transformers>=3.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.7",
]

[tool.setuptools]
packages = ["app", "app.routers", "ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: falso positivo con el patrón de inyección de dependencias de FastAPI
# (`Session = Depends(get_db)`) — es la forma idiomática, no un bug.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
