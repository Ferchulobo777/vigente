services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vigente
      POSTGRES_PASSWORD: vigente
      POSTGRES_DB: vigente
    ports:
      - "5433:5432"
    volumes:
      - vigente_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigente"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  vigente_db:
